name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # A new push supersedes the run already in flight for the same branch.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        # The suite runs against in-memory SQLite, so CI needs no database
        # service container and the whole job stays under a minute.
        run: pytest -q --cov=task_management --cov-report=term-missing

  frontend:
    name: Frontend (typecheck, vitest, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    # Catches a broken Dockerfile here rather than on the deploy that follows.
    needs: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: taskforge:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          docker run -d --name taskforge -p 8000:8000 \
            -e APP_ENV=production \
            -e SECRET_KEY=ci-only-not-a-real-secret \
            -e DATABASE_URL=sqlite:///ci.db \
            taskforge:ci

          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/healthz; then
              echo "\nContainer is healthy"
              exit 0
            fi
            sleep 2
          done

          echo "Container never became healthy:"
          docker logs taskforge
          exit 1
